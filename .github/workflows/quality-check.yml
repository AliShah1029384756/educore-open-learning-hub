name: EduCore Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-learning-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate learning datasets
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          files = [Path('data.json'), Path('subjects.json')]
          seen_urls = {}
          seen_titles = {}
          errors = []
          warnings = []
          topic_count = 0
          category_ids = set()
          allowed_types = {'Video', 'Read', 'Practice'}
          allowed_languages = {'English', 'Urdu', 'Urdu/English', 'English/Urdu', 'Arabic'}

          def add_error(message):
              errors.append(message)

          for path in files:
              if not path.exists():
                  if path.name == 'subjects.json':
                      continue
                  add_error(f'Missing required dataset: {path}')
                  continue

              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  add_error(f'{path}: invalid JSON: {exc}')
                  continue

              categories = data.get('categories')
              if not isinstance(categories, list):
                  add_error(f'{path}: categories must be an array')
                  continue

              for category in categories:
                  if not isinstance(category, dict):
                      add_error(f'{path}: category must be an object')
                      continue

                  category_id = str(category.get('id', '')).strip()
                  if not category_id:
                      add_error(f'{path}: category without id')
                  elif category_id in category_ids:
                      warnings.append(f'duplicate category id across datasets: {category_id}')
                  else:
                      category_ids.add(category_id)

                  subjects = category.get('subjects', [])
                  if not isinstance(subjects, list):
                      add_error(f'{path}: subjects must be an array in category {category_id!r}')
                      continue

                  for subject in subjects:
                      if not isinstance(subject, dict):
                          add_error(f'{path}: subject must be an object')
                          continue

                      subject_name = str(subject.get('subjectName', '')).strip()
                      if not subject_name:
                          add_error(f'{path}: subject without subjectName')

                      topics = subject.get('topics', [])
                      if not isinstance(topics, list):
                          add_error(f'{path}: topics must be an array for {subject_name!r}')
                          continue

                      for topic in topics:
                          topic_count += 1
                          if not isinstance(topic, dict):
                              add_error(f'{path}: topic must be an object')
                              continue

                          title = str(topic.get('title', '')).strip()
                          url = str(topic.get('url', '')).strip()
                          resource_type = str(topic.get('type', '')).strip()
                          language = str(topic.get('language', '')).strip()

                          if not title:
                              add_error(f'{path}: topic without title in {subject_name!r}')

                          if not url:
                              add_error(f'{path}: missing URL for {title or "<untitled>"}')
                          else:
                              parsed = urlparse(url)
                              if parsed.scheme not in {'http', 'https'} or not parsed.netloc:
                                  add_error(f'{path}: invalid URL for {title!r}: {url!r}')
                              elif url in seen_urls:
                                  warnings.append(f'duplicate URL: {url} ({seen_urls[url]} and {path})')
                              else:
                                  seen_urls[url] = path.name

                          if resource_type not in allowed_types:
                              add_error(f'{path}: unsupported type {resource_type!r} for {title!r}')

                          if language and language not in allowed_languages:
                              warnings.append(f'{path}: review language {language!r} for {title!r}')

                          title_key = title.casefold()
                          if title_key:
                              if title_key in seen_titles:
                                  warnings.append(f'duplicate title: {title!r} ({seen_titles[title_key]} and {path})')
                              else:
                                  seen_titles[title_key] = path.name

          required_files = [
              'index.html',
              'app.js',
              'styles.css',
              'global.css',
              'site-shell.js',
              'learning-paths.html',
              'learning-paths.js',
              'materials-library.html'
          ]
          for required in required_files:
              if not Path(required).exists():
                  add_error(f'Missing required project file: {required}')

          print(f'Validated {topic_count} learning topics.')
          print(f'Unique URLs: {len(seen_urls)}')
          print(f'Unique titles: {len(seen_titles)}')
          print(f'Category IDs: {len(category_ids)}')

          for warning in warnings:
              print(f'Warning: {warning}')

          if errors:
              print('\nQUALITY CHECK FAILED')
              for error in errors:
                  print(f'Error: {error}')
              sys.exit(1)

          print('QUALITY CHECK PASSED')
          PY
